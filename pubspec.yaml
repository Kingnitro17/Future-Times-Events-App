name: future_times_events
description: "Future Times Events mobile discovery and ticketing app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc: ^8.1.4

  # Networking
  supabase_flutter: ^2.8.1

  # Code Generation / Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image Loading
  cached_network_image: ^3.4.1

  # Navigation
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.2

  # UI Utilities
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3

  # Misc
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: 14.0.3
  url_launcher: 6.3.2
  qr_flutter: 4.1.0
  share_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider_foundation: 2.5.1

