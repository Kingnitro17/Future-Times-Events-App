workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS without codesign
        script: flutter build ios --release --no-codesign

      - name: Locate .app and package as IPA
        script: |
          set -e
          APP_PATH=$(find . -name "Runner.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find Runner.app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          rm -rf Payload
          echo "IPA created at $(pwd)/Runner.ipa"

      - name: Upload IPA to transfer.sh (backup)
        script: |
          curl --upload-file ./Runner.ipa https://transfer.sh/Runner.ipa || true

    artifacts:
      - Runner.ipa
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - nigelmarara0@gmail.com
        notify:
          success: true
          failure: true